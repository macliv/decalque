<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Decalque com câmera</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--fg:#eceef2;--mut:#9aa1ad;--ac:#ffb020;--pn:rgba(18,20,26,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:var(--fg);background:#232733;border:1px solid #343a4a;border-radius:12px;padding:12px 16px}
button:active{filter:brightness(1.3)}
.p{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
#home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#home h1{margin:0;font-size:26px}#home p{margin:0;color:var(--mut);max-width:340px;line-height:1.4}
#home button{width:100%;max-width:340px;padding:16px;font-size:18px}
#thumb{max-width:160px;max-height:160px;border-radius:10px;border:1px solid #343a4a;display:none;background:#fff}
#err{display:none;background:#4a1d1d;border:1px solid #a33;border-radius:10px;padding:12px;max-width:340px;line-height:1.4;font-size:15px}
#cam{position:fixed;inset:0;display:none;background:#000}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ov{position:absolute;inset:0;overflow:hidden;touch-action:none;z-index:1}
#ref{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;pointer-events:none;user-select:none;-webkit-user-drag:none}
#bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px}
#bar button{padding:9px 12px;font-size:14px;background:rgba(18,20,26,.82)}
#lk.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
#warn{position:absolute;z-index:6;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:#c62828;color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;display:none;text-align:center;width:max-content;max-width:92%}
#toast{position:absolute;z-index:7;left:50%;bottom:40%;transform:translateX(-50%);background:#232733;padding:10px 14px;border-radius:10px;display:none}
#pn{position:absolute;z-index:5;left:0;right:0;bottom:0;background:var(--pn);padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);max-height:55%;overflow:auto;border-radius:16px 16px 0 0}
.r{display:grid;grid-template-columns:96px 1fr 48px;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.r span:last-child{text-align:right;color:var(--mut);font-size:13px}
input[type=range]{width:100%;accent-color:var(--ac);height:30px}
#pn button{margin-top:8px;width:100%;padding:10px}
[hidden]{display:none!important}
</style></head><body>
<div id="home">
  <h1>✏️ Decalque com câmera</h1>
  <p>Escolha uma imagem, apoie o celular num suporte sobre a folha e desenhe seguindo as linhas.</p>
  <img id="thumb" alt="Imagem escolhida">
  <button class="p" id="bImg">Escolher imagem</button>
  <button id="bCam">Abrir câmera</button>
  <div id="err" role="alert"></div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div id="cam">
  <video id="vid" playsinline muted autoplay></video>
  <div id="ov"><img id="ref" alt=""></div>
  <div id="bar">
    <button id="bx" aria-label="Voltar">✕</button>
    <button id="lk">Travar na folha</button>
    <button id="bc">Centralizar</button>
    <button id="bp">Ocultar painel</button>
  </div>
  <div id="warn">⚠ Perdi a folha. Volte a enquadrar o papel.</div>
  <div id="toast"></div>
  <div id="pn">
    <div class="r"><span>Opacidade</span><input type="range" id="sO" min="5" max="100"><span id="vO"></span></div>
    <div class="r"><span>Zoom imagem</span><input type="range" id="sZ" min="10" max="500"><span id="vZ"></span></div>
    <div class="r"><span>Posição X</span><input type="range" id="sX" step="1"><span id="vX"></span></div>
    <div class="r"><span>Posição Y</span><input type="range" id="sY" step="1"><span id="vY"></span></div>
    <div class="r" id="rc" hidden><span>Zoom câmera</span><input type="range" id="sC"><span id="vC"></span></div>
    <button id="bt">Trocar imagem</button>
  </div>
</div>
<script>
const $=i=>document.getElementById(i);
const S={x:0,y:0,s:1,r:0,o:.5};
let url=null,stream=null,track=null,wl=null,lock=false,tm=null,prev=null,bad=0;
const vid=$('vid'),ref=$('ref'),ov=$('ov');

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function apply(){
  ref.style.opacity=S.o;
  ref.style.transform=`translate(-50%,-50%) translate(${S.x}px,${S.y}px) rotate(${S.r}rad) scale(${S.s})`;
  $('sO').value=S.o*100;$('sZ').value=S.s*100;$('sX').value=S.x;$('sY').value=S.y;
  $('vO').textContent=Math.round(S.o*100)+'%';$('vZ').textContent=Math.round(S.s*100)+'%';
  $('vX').textContent=Math.round(S.x);$('vY').textContent=Math.round(S.y);
}
function center(){S.x=0;S.y=0;S.s=1;S.r=0;apply()}
function ranges(){
  $('sX').min=-innerWidth;$('sX').max=innerWidth;$('sY').min=-innerHeight;$('sY').max=innerHeight;
}
$('sO').oninput=e=>{S.o=e.target.value/100;apply()};
$('sZ').oninput=e=>{S.s=e.target.value/100;apply()};
$('sX').oninput=e=>{S.x=+e.target.value;apply()};
$('sY').oninput=e=>{S.y=+e.target.value;apply()};

/* imagem */
$('bImg').onclick=$('bt').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(f);
  ref.onload=()=>{ref.style.width=Math.round(innerWidth*.9)+'px';center()};
  ref.src=url;
  const t=$('thumb');t.src=url;t.style.display='block';
  $('err').style.display='none';e.target.value='';
};

/* gestos */
const P=new Map();
ov.addEventListener('pointerdown',e=>{ov.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY])});
ov.addEventListener('pointermove',e=>{
  const o=P.get(e.pointerId);if(!o)return;
  const n=[e.clientX,e.clientY];
  if(P.size===1){S.x+=n[0]-o[0];S.y+=n[1]-o[1]}
  else if(P.size===2){
    let q=null;for(const [k,v] of P)if(k!==e.pointerId)q=v;
    const d0=Math.hypot(o[0]-q[0],o[1]-q[1])||1,d1=Math.hypot(n[0]-q[0],n[1]-q[1])||1;
    const a0=Math.atan2(o[1]-q[1],o[0]-q[0]),a1=Math.atan2(n[1]-q[1],n[0]-q[0]);
    S.s=Math.min(5,Math.max(.1,S.s*d1/d0));
    S.r+=a1-a0;
    S.x+=(n[0]-o[0])/2;S.y+=(n[1]-o[1])/2;
  }
  P.set(e.pointerId,n);apply();
});
const up=e=>P.delete(e.pointerId);
ov.addEventListener('pointerup',up);ov.addEventListener('pointercancel',up);

/* câmera */
function errMsg(e){
  const n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')return'Permissão da câmera negada. Toque no cadeado ao lado do endereço no Chrome, permita a câmera e tente de novo. Se esta página estiver dentro de outro app, abra o link direto no Chrome.';
  if(n==='NotFoundError'||n==='OverconstrainedError')return'Nenhuma câmera traseira foi encontrada neste aparelho.';
  if(n==='NotReadableError'||n==='AbortError')return'Não consegui usar a câmera. Ela pode estar em uso por outro app. Feche os outros apps e tente de novo.';
  return'Erro ao abrir a câmera'+(n?' ('+n+')':'')+'. Tente de novo ou abra o link direto no Chrome.';
}
function showErr(t){const e=$('err');e.textContent=t;e.style.display='block'}
$('bCam').onclick=async()=>{
  $('err').style.display='none';
  if(!url){showErr('Escolha uma imagem de referência primeiro.');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showErr('Este navegador não dá acesso à câmera. Abra o link no Chrome, em conexão segura (https).');return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){showErr(errMsg(e));return}
  try{
    vid.srcObject=stream;await vid.play();
  }catch(e){stopCam();showErr(errMsg(e));return}
  track=stream.getVideoTracks()[0];
  $('home').style.display='none';$('cam').style.display='block';
  ranges();apply();setupZoom();getWake();
};
function setupZoom(){
  let c=null;try{c=track.getCapabilities&&track.getCapabilities()}catch(e){}
  const rc=$('rc');
  if(c&&c.zoom&&c.zoom.max>c.zoom.min){
    const s=$('sC');s.min=c.zoom.min;s.max=c.zoom.max;s.step=c.zoom.step||.1;
    s.value=(track.getSettings&&track.getSettings().zoom)||c.zoom.min;
    $('vC').textContent=(+s.value).toFixed(1)+'x';rc.hidden=false;
  }else rc.hidden=true;
}
$('sC').oninput=async e=>{
  const v=+e.target.value;$('vC').textContent=v.toFixed(1)+'x';
  try{await track.applyConstraints({advanced:[{zoom:v}]})}catch(x){}
  prev=null;
};
function stopCam(){
  setLock(false);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;track=null;vid.srcObject=null;
  if(wl){wl.release().catch(()=>{});wl=null}
}
$('bx').onclick=()=>{stopCam();$('cam').style.display='none';$('home').style.display='flex'};
async function getWake(){
  try{if('wakeLock' in navigator&&stream)wl=await navigator.wakeLock.request('screen')}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&stream)getWake()});
$('bc').onclick=center;
$('bp').onclick=()=>{const p=$('pn');p.hidden=!p.hidden;$('bp').textContent=p.hidden?'Mostrar painel':'Ocultar painel'};
addEventListener('resize',ranges);

/* tracking por comparação de blocos (só deslocamento) */
const W=96,R=7,cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function grab(){
  const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return null;
  const H=Math.round(W*vh/vw);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  cx.drawImage(vid,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);
  for(let i=0,j=0;j<g.length;i+=4,j++)g[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
  return{g,H};
}
function match(a,b,H){
  const x0=R+3,x1=W-R-3,y0=R+3,y1=H-R-3,N=2*R+1,sad=new Float64Array(N*N);
  let n=0,m=0;
  for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){m+=a[y*W+x];n++}
  m/=n;let tex=0;
  for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2)tex+=Math.abs(a[y*W+x]-m);
  tex/=n;
  let best=1e12,bi=0,sum=0;
  for(let v=-R;v<=R;v++)for(let u=-R;u<=R;u++){
    let s=0;
    for(let y=y0;y<y1;y+=2){const ra=y*W,rb=(y+v)*W+u;for(let x=x0;x<x1;x+=2)s+=Math.abs(b[rb+x]-a[ra+x])}
    const k=(v+R)*N+u+R;sad[k]=s;sum+=s;
    if(s<best){best=s;bi=k}
  }
  const avg=sum/(N*N),bu=bi%N,bv=(bi-bu)/N;
  let du=bu-R,dv=bv-R;
  const sub=(l,c,r)=>{const d=l-2*c+r;return d>1e-6?(l-r)/(2*d):0};
  if(bu>0&&bu<N-1)du+=sub(sad[bi-1],sad[bi],sad[bi+1]);
  if(bv>0&&bv<N-1)dv+=sub(sad[bi-N],sad[bi],sad[bi+N]);
  const ok=tex>4&&best/n<22&&(avg-best)/avg>.2;
  return{du,dv,ok};
}
function tick(){
  const c=grab();if(!c)return;
  if(prev&&prev.H===c.H){
    const r=match(prev.g,c.g,c.H);
    if(r.ok){
      bad=0;$('warn').style.display='none';
      const sc=Math.max(vid.clientWidth/vid.videoWidth,vid.clientHeight/vid.videoHeight);
      const k=sc*vid.videoWidth/W;
      S.x+=r.du*k;S.y+=r.dv*k;apply();
    }else if(++bad>=3)$('warn').style.display='block';
  }
  prev=c;
}
function setLock(on){
  lock=on;clearInterval(tm);prev=null;bad=0;
  $('lk').classList.toggle('on',on);
  $('lk').textContent=on?'Destravar':'Travar na folha';
  $('warn').style.display='none';
  if(on){tm=setInterval(tick,90);toast('Travado. Pode mexer o celular.')}
}
$('lk').onclick=()=>setLock(!lock);
</script></body></html>
